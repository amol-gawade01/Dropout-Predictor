[project]
name = "sih-student-success"
version = "0.1.0"
description = "AI-powered student retention and Socratic learning platform for SIH"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2",
    "pgvector",
    "pandas",
    "openpyxl",
    "numpy",
    "scikit-learn>=1.9,<2",
    "xgboost-cpu>=3.4,<4",
    "shap>=0.52,<0.53",
    "joblib",
    "langgraph>=1.2.11",
    "langchain-google-genai>=4.3.5",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
