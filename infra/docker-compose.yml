services:
  postgres:
    image: pgvector/pgvector:pg18-bookworm
    container_name: sih-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: student_success

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ../database/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sih_user -d student_success"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: